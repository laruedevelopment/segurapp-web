name: Desplegar a SegurAppRSAS

# Publica la app en https://laruedevelopment.github.io/SegurAppRSAS/ (repositorio
# laruedevelopment/SegurAppRSAS, rama principal). La copia de respaldo de la app
# Flutter vive en la subcarpeta /flutter/ de ese mismo sitio y NO se toca aquí.
#
# Requiere el secreto DEPLOY_TOKEN: un token con permiso de escritura (Contents)
# sobre el repositorio laruedevelopment/SegurAppRSAS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_BASE: /SegurAppRSAS/
          # Valores públicos (la clave anon va dentro de la app por diseño; la seguridad la dan las reglas RLS).
          VITE_SUPABASE_URL: https://tmuapctazakdecyddelw.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtdWFwY3RhemFrZGVjeWRkZWx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2Mzk3ODgsImV4cCI6MjA4NTIxNTc4OH0.dC28gXPut6VqkYswXlToWoFTJ2LISZBQYHAmyapKlWI
          VITE_APP_ENV: prod
      # GitHub Pages no conoce las rutas internas: 404.html = index.html.
      - run: cp dist/index.html dist/404.html

      - name: Publicar en SegurAppRSAS
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${DEPLOY_TOKEN}@github.com/laruedevelopment/SegurAppRSAS.git" deploy_repo
          cd deploy_repo
          # Se limpia la raíz (la versión anterior) pero se conserva el respaldo /flutter/.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name flutter ! -name CNAME -exec rm -rf {} +
          cp -r ../dist/. .
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy React: ${GITHUB_SHA}"
          git push
